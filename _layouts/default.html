<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/assets/logo.jpg' | relative_url }}">

  {% if page.font_awesome %}
  <!-- Font Awesome — social platform icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >
  {% endif %}

  <!-- Design tokens — swap this file to apply a new brand -->
  <link rel="stylesheet" href="{{ '/config/theme.css' | relative_url }}">

  <!-- Layout and components -->
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  {% for script in page.scripts %}
  <script src="{{ script | relative_url }}"></script>
  {% endfor %}

</body>
</html>
